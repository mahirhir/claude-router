name: Feature request
description: Suggest an improvement to the toolkit
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request does not require committing credentials or provider-specific secrets.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user problem or limitation should be solved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the user-facing result, not only an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: textarea
    attributes:
      label: Scope and compatibility
      description: Note affected Windows, PowerShell, VSCode, router, or provider versions.
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this feature.
